[package]
name = "ccez-listen"
version = "0.1.0"
description = "Listening drills: find a video's audio in a language, fetch it with its word-timed captions"
edition = "2021"
publish = false

[lib]
name = "ccez_listen"
path = "src/lib.rs"

[[bin]]
name = "ccez-listen"
path = "src/bin/ccez-listen.rs"
required-features = ["server"]

[features]
server = ["dep:tiny_http"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = { version = "0.12", optional = true }
