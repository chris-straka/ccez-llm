[package]
name = "ccez-llm"
version = "0.4.6"
description = "A personalized/opinionated LLM client"
authors = ["ccez"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ccez_llm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon + image-png feed the desktop summon kit (desktop.rs tray):
# both crates already sit in Cargo.lock as transitive deps, so no new
# crate is vendored by enabling them here.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Triage 2026-09-12 (Dependabot #2, glib VariantStrIter unsoundness,
# moderate): the gtk 0.18 stack under tauri/wry pulls glib 0.18 (fixed
# only in glib >= 0.20). A solo bump is rejected by the solver, verified
# by hand: `cargo update -p glib --precise 0.20.0` fails on gtk 0.18.2
# requiring glib ^0.18. No migration path exists upstream — tauri 2.11.5
# (latest) and wry 0.57.0 (latest) both still pin gtk ^0.18, and the next
# gtk series (0.19) wants glib ^0.22. Revisit when tauri/wry migrate off
# gtk 0.18. No app code touches glib directly, and `cargo tree` proves
# the crate compiles on Linux only (absent from the macOS target tree;
# reached via tray-icon -> libappindicator -> gtk).
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-haptics = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Base64 image payloads for on-device OCR (ocr.rs). Version matches the
# copy already in Cargo.lock (transitive), so no new crate is vendored.
base64 = "0.22"
# Default TLS crypto provider (ring). Tauri core's mobile-dev protocol
# handler builds a reqwest client that panics without one — see
# install_tls_provider in lib.rs.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

# Native TTS (AVSpeechSynthesizer) on macOS and iOS. Pure-Rust
# bindings via objc2 — no Objective-C is written anywhere in this
# project. AppKit stays macOS-only: it does not exist on iOS.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-avf-audio = "0.3"
objc2-natural-language = "0.3"
[target.'cfg(target_os = "macos")'.dependencies]
# block2 feature: the traffic-light hover monitor passes a block to
# NSEvent's local monitor (dictate/tts use block2 directly, not
# through AppKit types).
objc2-app-kit = { version = "0.3", features = ["block2"] }
# Speech-recognition authorization callback (dictate_macos only).
block2 = "0.6"
# On-device text recognition (Vision VNRecognizeTextRequest, ocr.rs).
# Pure-Rust bindings through objc2 — no Objective-C is written anywhere
# in this project, same rule as the TTS bridge in tts.rs.
objc2-vision = "0.3"

# Global summon chord (desktop only — the plugin crate is
# `#![cfg(not(mobile))]` upstream and does not compile for
# Android/iOS; the registration in lib.rs is `#[cfg(desktop)]`).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Android-only native TTS (TextToSpeech over JNI into Tts.kt).
# jni matches wry's version so JNI types unify (see cargo tree).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Windows-only speech bindings: WinRT SpeechRecognizer
# (dictate_windows) and SAPI 5 automation (tts_windows). The features
# must be declared here — nothing else in the graph enables the speech
# APIs, so without this the Windows build finds no
# `windows::Media::SpeechRecognition` / `windows::Win32::Media::Speech`.
# windows 0.61 pairs with the windows-sys 0.61 already in the lock.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Media_SpeechRecognition",
    "Storage_Streams",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_Power",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
