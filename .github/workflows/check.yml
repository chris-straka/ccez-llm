name: check

# Cross-target Rust gates on every push and PR. The v0.2.1 release taught
# this lesson: per-OS `#[tauri::command]` attributes and Windows crate
# features only break the build on their own target, and nothing compiled
# those targets until release CI ran. These `cargo check` jobs compile
# every target the release workflows bundle, minus the bundling itself.

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same ref supersedes the older run: the old jobs
# are cancelled instead of burning four OS runners on stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend gates (colocated Vitest, no Tauri build): fast signal
  # while the Rust jobs compile. The bun install cache below is keyed by
  # bun.lock, so dependency-only reruns skip the registry. The production
  # build rides along because dev and svelte-check resolve the working
  # tree: only `vite build` (what the release runs as beforeBuildCommand)
  # fails on a missing export whose implementation never got committed —
  # exactly how v0.4.11 shipped unbuildable while every gate stayed green.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  rust-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo test --manifest-path listen/Cargo.toml

  rust-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: cargo check --locked --target x86_64-unknown-linux-gnu

  rust-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Both matrix legs share one cache entry: the target dirs differ
      # per leg, the registry does not, and separate keys would evict
      # each other on every other push.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "windows"
      - run: cargo check --locked --target ${{ matrix.target }}

  # iOS has no release leg yet (signing waits on an Apple Developer
  # account), so nothing else compiles its cfg: `mobile` + objc2 iOS
  # paths + the BoringSSL iOS build. preview.yml builds and runs the
  # full Simulator app on preview branches.
  rust-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "ios"
      - run: cargo check --locked --target aarch64-apple-ios

  # The release's Android leg is the only `not(desktop)` target shipped:
  # mobile shells run a single webview, so window-builder methods like
  # `focused`/`skip_taskbar` don't exist there and only this job compiles
  # that cfg. v0.7.0 proved the gap: every gate stayed green while the
  # release's Android leg failed on `og_image.rs`. Build scripts still
  # compile C for the target under `cargo check`, so the NDK install is
  # required (same revision the release leg uses); the Android platform
  # package is not — only the Gradle APK build needs that.
  rust-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(echo "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | cut -d' ' -f1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;30.0.16138531"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16138531" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      # Plain `cargo check` gets none of the NDK compiler env that
      # `tauri android build` sets up in the release leg, and cc-rs
      # (ring's build script) does not read ANDROID_NDK_HOME itself —
      # without these it dies looking for `aarch64-linux-android-clang`
      # on PATH. Wrapper API 36 matches the app's compileSdk.
      - run: cargo check --locked --target aarch64-linux-android
        env:
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android36-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android36-clang++
          AR_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
