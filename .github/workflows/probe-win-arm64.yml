name: probe-win-arm64

# Diagnostic for the dropped windows-arm64 release leg: builds only the
# vendored BoringSSL bindings for aarch64-pc-windows-msvc and uploads the
# generated bindings.rs plus the -vv build log, so the opaque-struct
# failure (E0609 on srtp_protection_profile_st / ssl_early_callback_ctx)
# can be read instead of guessed. Two variants: stock, and with an
# explicit clang target for bindgen.
on:
  workflow_dispatch:
  push:
    branches: [release-refresh-win-ios]
    paths:
      - .github/workflows/probe-win-arm64.yml
      - src-tauri/vendor/boring-sys-imp/**
      - src-tauri/vendor/boring-imp/**

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        variant: [stock, clang-target]
    runs-on: windows-11-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Toolchain facts
        shell: bash
        run: |
          echo "LIBCLANG_PATH=${LIBCLANG_PATH:-unset}"
          which clang && clang --version || true
          ls "/c/Program Files/LLVM/bin" 2>/dev/null | grep -i libclang || true
          file "/c/Program Files/LLVM/bin/libclang.dll" 2>/dev/null || true
          rustc -vV
      - name: Build boring-sys bindings
        shell: bash
        working-directory: src-tauri
        run: |
          if [ "${{ matrix.variant }}" = clang-target ]; then
            export BINDGEN_EXTRA_CLANG_ARGS_aarch64_pc_windows_msvc="--target=aarch64-pc-windows-msvc"
          fi
          set +e
          cargo build --locked -p boring-imp --target aarch64-pc-windows-msvc -vv > "$RUNNER_TEMP/build.log" 2>&1
          echo "exit=$?"
          grep -iE "warning: boring|error|clang" "$RUNNER_TEMP/build.log" | grep -v "Compiling\|Fresh\|Running" | head -80
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/out/"
          for f in $(find target/aarch64-pc-windows-msvc -name bindings.rs -path '*boring-sys-imp*'); do
            cp "$f" "$RUNNER_TEMP/out/bindings.rs"
            grep -n -A8 "pub struct srtp_protection_profile_st\|pub struct ssl_early_callback_ctx" "$f" | head -40
          done
          exit 0
      - uses: actions/upload-artifact@v6
        with:
          name: probe-${{ matrix.variant }}
          path: ${{ runner.temp }}/out
