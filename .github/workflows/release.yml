name: release

# Cut a release: push a tag like `v0.1.0` and CI builds every artifact
# into ONE draft GitHub Release:
#   macOS: per-arch .dmgs (ARM64-only + Intel-only, no universal binary)
#     + updater artifacts (*.app.tar.gz + *.sig)
#   Linux: .deb + .AppImage bundles (+ .sig updater artifacts)
#   Windows: NSIS installers (per-arch: x64 + ARM64) + updater signatures
#   Android: signed APK
# plus latest.json (the in-app updater manifest, synthesized by the
# tail job from the renamed bundles + the draft's asset IDs).
#
# One-time setup before the first release (repo Settings -> Secrets -> Actions):
#   updater (desktop builds sign updates with these):
#     TAURI_SIGNING_PRIVATE_KEY            (contents of ~/.tauri/ccez.key)
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD   (the password set at key generation)
#   android (`keytool -genkey -v -keystore ~/upload-keystore.jks -keyalg RSA
#     -keysize 2048 -validity 10000 -alias upload`, same password twice):
#     ANDROID_KEYSTORE_BASE64  (`base64 -i ~/upload-keystore.jks | pbcopy`)
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS          (e.g. `upload`)
# No Apple Developer account needed: the macOS bundle is ad-hoc signed, so
# the first launch on another Mac needs right-click -> Open. The APK
# installs directly from the Releases page (allow unknown sources once).
#
# ORDERING (parallel builders, exactly-one writer): v0.2.2 proved that
# concurrent jobs uploading to the same draft silently lose files (the
# Intel .dmg, both Linux .sigs, and the x64 Windows .sig all uploaded
# "successfully" yet never landed). The six platform legs below therefore
# NEVER touch the draft: they run in parallel, hold only `contents: read`,
# and publish their bundles as workflow artifacts
# (actions/upload-artifact). The single serial tail job `release`
# downloads those artifacts and is the SOLE job that writes to the draft
# (create + attach + verify + publish). `prune-old-releases` only deletes
# older releases, never the current draft. A shared `concurrency` group
# was tried first and made it worse: GitHub cancels queued runs in the
# group instead of queueing them, which killed whole platform builds.
# `needs: build -> release -> prune-old-releases` is the mechanism.
#
# Builds run through `bunx tauri build` (desktop) / `bunx tauri android
# build` (Android). tauri-action's own upload path is deliberately NOT
# used: uploads to the draft happen in exactly one place (the tail job).

on:
  push:
    tags:
      - "v*"

jobs:
  # Six platform legs, fully parallel. No leg touches the GitHub Release:
  # each one uploads its bundle directory as a workflow artifact that the
  # tail job collects. `fail-fast: false` so one red platform does not
  # hide the results of the other five.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_target_flag: --target aarch64-apple-darwin
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle
            android: false
          - name: macos-x86_64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            tauri_target_flag: --target x86_64-apple-darwin
            bundle_dir: src-tauri/target/x86_64-apple-darwin/release/bundle
            android: false
          # Windows NSIS installers (per-arch: x64 + ARM64) and their updater
          # signatures, signed with the SAME TAURI_SIGNING_* secrets as above.
          # Runs only on GitHub-hosted Windows runners; there is deliberately no
          # local Windows build path (maintainers develop on macOS).
          # Code signing note: the .exe is NOT Authenticode-signed (no certificate
          # is configured), so Windows SmartScreen shows an "Unknown publisher"
          # prompt on first install. The in-app updater signature (TAURI_SIGNING_*)
          # is unrelated to SmartScreen and IS configured here.
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_target_flag: --target x86_64-pc-windows-msvc --bundles nsis
            bundle_dir: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
            android: false
          - name: windows-arm64
            # ARM64: native build on a native ARM64 runner (cross-linking ARM64
            # from an x64 runner is NOT trivial, hence a separate leg).
            # windows-11-arm is GA for public repositories; it does NOT work in
            # private repositories -- if this repo ever goes private, drop this
            # leg (x64 keeps working).
            # Watch item: the windows-11-arm label migrates to a VS2026-based
            # image starting 2026-09-21 (runner-images #14602). This leg pins no
            # VS version (MSVC comes from the image, NSIS from the Tauri CLI), so
            # there is nothing to pre-pin -- but if the first post-migration
            # release fails here, suspect the image (NSIS/MSVC paths) first.
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            tauri_target_flag: --target aarch64-pc-windows-msvc --bundles nsis
            bundle_dir: src-tauri/target/aarch64-pc-windows-msvc/release/bundle
            android: false
          # Linux distribution artifacts:
          #   - .deb bundle  (Debian / Ubuntu / Pop!_OS / Asahi-Debian-remix installs)
          #   - .AppImage bundle (distro-agnostic fallback)
          #   - updater artifacts (*.sig), signed when the TAURI_SIGNING_*
          #     secrets are present (same secrets as above).
          # The AUR -bin package (packaging/aur/PKGBUILD) downloads the .deb
          # attached by the tail job, so a Linux release is not complete
          # until this leg is green.
          # Baseline: ubuntu-22.04 on purpose. Tauri links against the build
          # host's glibc/WebKitGTK, so building on the OLDEST supported base
          # (22.04, which ships libwebkit2gtk-4.1) keeps the binaries runnable on
          # newer systems. Building on 24.04+ raises the minimum glibc and breaks
          # older installs.
          - name: linux-x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_target_flag: --bundles deb,appimage
            bundle_dir: src-tauri/target/release/bundle
            android: false
          - name: android-arm64
            os: ubuntu-latest
            rust_target: aarch64-linux-android
            tauri_target_flag: ""
            bundle_dir: src-tauri/gen/android/app/build/outputs/apk
            android: true
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Read-only on purpose: this job must never write to the draft release.
    # Uploading workflow artifacts needs no write permission.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-java@v5
        if: matrix.android == true
        with:
          distribution: temurin
          java-version: 17
      # No setup-android action on purpose: android-actions/setup-android
      # installs the long-removed legacy `tools` SDK package by default
      # (`sdkmanager tools` -> "Failed to find package 'tools'", exit 1),
      # which broke the v0.4.4 release. ubuntu-latest already ships the
      # SDK + cmdline-tools, so install just the platform and NDK directly.
      - name: Install Android platform and NDK
        if: matrix.android == true
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(echo "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | cut -d' ' -f1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "ndk;30.0.16138531"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16138531" >> "$GITHUB_ENV"
      - run: bun install
      - name: Write keystore.properties from secrets
        if: matrix.android == true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEYSTORE_PASSWORD
          EOF
      # Desktop legs build with the Tauri CLI directly. The CLI only writes
      # to the local target dir; the upload-artifact step below is the only
      # network write this job performs (workflow artifacts, not the draft).
      - name: Build bundles with Tauri CLI
        if: matrix.android != true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri build ${{ matrix.tauri_target_flag }}
      - name: Build signed APK with Tauri CLI
        if: matrix.android == true
        run: bunx tauri android build --apk --target aarch64
      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ matrix.bundle_dir }}
          if-no-files-found: error

  # Serial tail: the SOLE writer to the draft release. Runs only after all
  # six legs are green, downloads their workflow artifacts, renames every
  # bundle to a human-readable OS-arch name, merges the per-leg updater
  # fragments into one latest.json, attaches everything to the draft,
  # verifies the draft, then publishes it. Nothing else in this workflow
  # holds `contents: write` against the draft.
  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release download shells out to git; without a checkout the
      # manifest download fails even when every asset is present.
      - uses: actions/checkout@v5
      - name: Download all platform artifacts
        uses: actions/download-artifact@v7
        with:
          path: bundles
      # Human-readable asset names: Tauri names bundles `Ccez LLM <ver> <arch>`
      # with a different arch word per OS (aarch64/amd64/x64/arm64), which no
      # downloader can decode at a glance. This step copies every bundle into
      # release-assets/ under its clean name. Signatures sign file contents,
      # not names, so they stay valid. latest.json is built by a later step
      # from the draft's asset IDs (see below), never merged from fragments:
      # `tauri build` writes no manifest of its own.
      - name: Collect and rename assets (rename-assets)
        run: |
          python3 - bundles release-assets <<'EOF'
          import os
          import shutil
          import sys

          src_root, dest_dir = sys.argv[1], sys.argv[2]
          os.makedirs(dest_dir, exist_ok=True)

          # (artifact dir, filename suffix, clean name), first match wins.
          # Leg-aware on purpose: the mac updater tarballs carry no
          # version/arch in the name, so only the leg disambiguates them;
          # suffixes (not version-pinned regexes) survive version bumps.
          RULES = [
              ("bundle-macos-aarch64", "_aarch64.dmg", "CcezLLM-macos-apple-silicon.dmg"),
              ("bundle-macos-aarch64", "Ccez LLM.app.tar.gz.sig", "CcezLLM-macos-apple-silicon.app.tar.gz.sig"),
              ("bundle-macos-aarch64", "Ccez LLM.app.tar.gz", "CcezLLM-macos-apple-silicon.app.tar.gz"),
              ("bundle-macos-x86_64", "_x64.dmg", "CcezLLM-macos-intel.dmg"),
              ("bundle-macos-x86_64", "Ccez LLM.app.tar.gz.sig", "CcezLLM-macos-intel.app.tar.gz.sig"),
              ("bundle-macos-x86_64", "Ccez LLM.app.tar.gz", "CcezLLM-macos-intel.app.tar.gz"),
              ("bundle-windows-x64", "-setup.exe.sig", "CcezLLM-windows-x64-setup.exe.sig"),
              ("bundle-windows-x64", "-setup.exe", "CcezLLM-windows-x64-setup.exe"),
              ("bundle-windows-arm64", "-setup.exe.sig", "CcezLLM-windows-arm64-setup.exe.sig"),
              ("bundle-windows-arm64", "-setup.exe", "CcezLLM-windows-arm64-setup.exe"),
              ("bundle-linux-x64", ".deb.sig", "CcezLLM-linux-x64.deb.sig"),
              ("bundle-linux-x64", ".deb", "CcezLLM-linux-x64.deb"),
              ("bundle-linux-x64", ".AppImage.sig", "CcezLLM-linux-x64.AppImage.sig"),
              ("bundle-linux-x64", ".AppImage", "CcezLLM-linux-x64.AppImage"),
              ("bundle-android-arm64", ".apk", "CcezLLM-android-arm64.apk"),
          ]

          placed = []
          for dirpath, _, filenames in os.walk(src_root):
              leg = os.path.relpath(dirpath, src_root).split(os.sep)[0]
              for fn in sorted(filenames):
                  match = None
                  for want_leg, suffix, clean in RULES:
                      if leg == want_leg and fn.endswith(suffix):
                          match = clean
                          break
                  if match is None:
                      print(f"IGNORED (no rule for {leg}): {fn}", flush=True)
                      continue
                  shutil.copyfile(os.path.join(dirpath, fn), os.path.join(dest_dir, match))
                  placed.append(match)
                  print(f"{leg}/{fn} -> {match}", flush=True)

          # Same gate as verify-release below: every expected file must be
          # present (the v0.2.2 silent-loss lesson), latest.json excepted —
          # the manifest step builds it next from the draft's asset IDs.
          expected = [
              "CcezLLM-macos-apple-silicon.dmg",
              "CcezLLM-macos-apple-silicon.app.tar.gz",
              "CcezLLM-macos-apple-silicon.app.tar.gz.sig",
              "CcezLLM-macos-intel.dmg",
              "CcezLLM-macos-intel.app.tar.gz",
              "CcezLLM-macos-intel.app.tar.gz.sig",
              "CcezLLM-linux-x64.deb",
              "CcezLLM-linux-x64.deb.sig",
              "CcezLLM-linux-x64.AppImage",
              "CcezLLM-linux-x64.AppImage.sig",
              "CcezLLM-windows-x64-setup.exe",
              "CcezLLM-windows-x64-setup.exe.sig",
              "CcezLLM-windows-arm64-setup.exe",
              "CcezLLM-windows-arm64-setup.exe.sig",
              "CcezLLM-android-arm64.apk",
          ]
          missing = [f for f in expected if f not in placed]
          if missing:
              for f in missing:
                  print(f"MISSING: {f}", flush=True)
              sys.exit(1)
          print("collect done.")
          EOF
      - name: Create draft and attach assets (sole release writer)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Ccez LLM ${{ github.ref_name }}"
          draft: true
          files: release-assets/*
      # Updater manifest: `tauri build` writes no latest.json of its own
      # (the old tauri-action generated it), so the tail synthesizes one
      # here from the renamed bundles — the same shape tauri-action
      # produced (base keys plus -app/-nsis/-appimage/-deb variants, the
      # .sig file contents as signatures), except URLs are public
      # releases/download links, not api.github.com asset URLs: current
      # `gh` reports GraphQL node IDs (RA_...) as asset `id`, and the
      # REST asset endpoint 404s on those (every v0.4.16 auto-update
      # failed downloading). Runs after the single upload above, so
      # every bundle exists; fails loud on any missing bundle or
      # signature.
      - name: Build and attach updater manifest (manifest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - release-assets "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" <<'EOF'
          import datetime
          import json
          import os
          import subprocess
          import sys

          dest_dir, ref, repo = sys.argv[1], sys.argv[2], sys.argv[3]
          ver = ref[1:] if ref.startswith("v") else ref
          out = subprocess.run(
              ["gh", "release", "view", ref, "--json", "assets", "--jq", ".assets"],
              capture_output=True, text=True, check=True,
          )
          by_name = {a["name"]: a["id"] for a in json.loads(out.stdout)}
          dl = f"https://github.com/{repo}/releases/download/{ref}"

          def sig_text(clean):
              with open(os.path.join(dest_dir, clean + ".sig")) as f:
                  return f.read().strip()

          # (manifest keys, updater bundle clean name)
          UPDATERS = [
              (["darwin-x86_64", "darwin-x86_64-app"], "CcezLLM-macos-intel.app.tar.gz"),
              (["darwin-aarch64", "darwin-aarch64-app"], "CcezLLM-macos-apple-silicon.app.tar.gz"),
              (["windows-x86_64", "windows-x86_64-nsis"], "CcezLLM-windows-x64-setup.exe"),
              (["windows-aarch64", "windows-aarch64-nsis"], "CcezLLM-windows-arm64-setup.exe"),
              (["linux-x86_64", "linux-x86_64-appimage"], "CcezLLM-linux-x64.AppImage"),
              (["linux-x86_64-deb"], "CcezLLM-linux-x64.deb"),
          ]

          platforms = {}
          for keys, bundle in UPDATERS:
              if bundle not in by_name:
                  print(f"ERROR: {bundle} not attached to the draft", flush=True)
                  sys.exit(1)
              try:
                  signature = sig_text(bundle)
              except FileNotFoundError:
                  print(f"ERROR: {bundle}.sig missing from {dest_dir}", flush=True)
                  sys.exit(1)
              entry = {"signature": signature, "url": f"{dl}/{bundle}"}
              for key in keys:
                  platforms[key] = entry
          manifest = {
              "version": ver,
              "notes": "",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z"),
              "platforms": platforms,
          }
          manifest_path = os.path.join(dest_dir, "latest.json")
          with open(manifest_path, "w") as f:
              json.dump(manifest, f, indent=2)
          subprocess.run(
              ["gh", "release", "upload", ref, manifest_path, "--clobber"],
              check=True,
          )
          print(f"manifest platforms: {','.join(sorted(platforms))}", flush=True)
          print("manifest done.")
          EOF
      # Durable gate for the v0.2.2 asset loss: this step runs right after
      # the single upload above, and fails the run if any expected file is
      # missing from the draft or any platform is missing from the updater
      # manifest.
      # (GitHub serves spaces in bundle names as dots; match the served names.)
      - name: Verify release assets and updater platforms (verify-release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # The release lookup itself retries: v0.3.0/v0.3.1 both failed
          # here with transient "release not found" on a draft that
          # existed before and after (all assets present on manual
          # re-check). The asset gate below stays required -- retries
          # only cover the lookup, never a missing file.
          ASSETS=""
          for i in 1 2 3 4 5; do
            if ASSETS="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null)"; then
              break
            fi
            echo "release lookup failed (attempt $i/5), retrying in 15s..."
            sleep 15
          done
          [ -n "$ASSETS" ] || { echo "release not found after retries"; exit 1; }
          missing=0
          for f in \
            "CcezLLM-macos-apple-silicon.dmg" \
            "CcezLLM-macos-apple-silicon.app.tar.gz" \
            "CcezLLM-macos-apple-silicon.app.tar.gz.sig" \
            "CcezLLM-macos-intel.dmg" \
            "CcezLLM-macos-intel.app.tar.gz" \
            "CcezLLM-macos-intel.app.tar.gz.sig" \
            "CcezLLM-linux-x64.deb" \
            "CcezLLM-linux-x64.deb.sig" \
            "CcezLLM-linux-x64.AppImage" \
            "CcezLLM-linux-x64.AppImage.sig" \
            "CcezLLM-windows-x64-setup.exe" \
            "CcezLLM-windows-x64-setup.exe.sig" \
            "CcezLLM-windows-arm64-setup.exe" \
            "CcezLLM-windows-arm64-setup.exe.sig" \
            "CcezLLM-android-arm64.apk" \
            "latest.json"; do
            echo "$ASSETS" | grep -qxF "$f" || { echo "MISSING: $f"; missing=1; }
          done
          for i in 1 2 3 4 5; do
            if gh release download "$GITHUB_REF_NAME" --pattern "latest.json" --dir "$RUNNER_TEMP/manifest" 2>/dev/null; then
              break
            fi
            echo "manifest download failed (attempt $i/5), retrying in 15s..."
            sleep 15
          done
          [ -f "$RUNNER_TEMP/manifest/latest.json" ] || { echo "latest.json missing after retries"; exit 1; }
          for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64 windows-aarch64; do
            grep -q "\"$platform\"" "$RUNNER_TEMP/manifest/latest.json" || { echo "MISSING PLATFORM: $platform"; missing=1; }
          done
          exit $missing
      # Solo-user convenience: publish automatically once verified. This repo
      # has one user, so no review gate is needed -- the verify step above is
      # the gate. Publishing flips Latest to this tag, which the updater reads.
      - name: Publish the verified draft (publish-release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            if gh release edit "$GITHUB_REF_NAME" --draft=false; then
              break
            fi
            echo "publish failed (attempt $i/5), retrying in 15s..."
            sleep 15
          done
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "false"

  # Tidiness automation: once the release above is verified, delete every
  # older release except the newest previous one (kept as a rollback
  # fallback). Runs last so it can never endanger the current artifacts;
  # a prune failure goes red without touching the verified release.
  prune-old-releases:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete releases older than the previous one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import subprocess
          repo = "chris-straka/ccez-llm"
          cur = os.environ["GITHUB_REF_NAME"]
          out = subprocess.run(
              ["gh", "release", "list", "--repo", repo,
               "--json", "tagName,createdAt", "--limit", "100"],
              capture_output=True, text=True, check=True,
          )
          older = sorted(
              (r for r in json.loads(out.stdout) if r["tagName"] != cur),
              key=lambda r: r["createdAt"], reverse=True,
          )
          for r in older[1:]:
              print("Deleting old release:", r["tagName"], flush=True)
              subprocess.run(
                  ["gh", "release", "delete", r["tagName"],
                   "--repo", repo, "--cleanup-tag", "-y"],
                  check=True,
              )
          print("Prune done.")
          EOF
